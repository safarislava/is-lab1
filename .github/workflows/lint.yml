name: Strict Monorepo Lint & Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint & Analysis (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: backend

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Backend Quality Checks (Checkstyle, PMD, SpotBugs, Compiler)
        run: ./gradlew check --no-daemon --stacktrace

      - name: Upload Backend Lint & Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/build/reports/checkstyle/
            backend/build/reports/pmd/
            backend/build/reports/spotbugs/
            backend/build/reports/tests/
          if-no-files-found: ignore

  frontend-lint:
    name: Frontend Lint & Typecheck (Vue 3 + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run ESLint (0 warnings allowed)
        run: npm run lint

      - name: Run Prettier format check
        run: npm run format:check

      - name: Run Vite build check
        run: npm run build
